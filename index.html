<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شکلات‌ساز کوچولو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff1d6;--card:#fff;--ink:#2b2a33;--mut:#7a7686;--acc:#8b4a2b;--bd:#ead7b8;--good:#2f9e44;--bad:#e5484d;--say:#ffe3a3;--belt:#555a66;--W:clamp(18px,5vw,34px);--H:clamp(50px,15vw,96px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241b17;--card:#33271f;--ink:#f6efe9;--mut:#bfb0a6;--acc:#d9925f;--bd:#55443a;--good:#5ccf72;--bad:#ff6b70;--say:#4d3a1f;--belt:#3b3f49}}
:root[data-theme="dark"]{--bg:#241b17;--card:#33271f;--ink:#f6efe9;--mut:#bfb0a6;--acc:#d9925f;--bd:#55443a;--good:#5ccf72;--bad:#ff6b70;--say:#4d3a1f;--belt:#3b3f49}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;display:flex;justify-content:center;touch-action:manipulation}
main{width:100%;max-width:720px;padding:clamp(8px,2vw,18px)}
h1{font-size:clamp(1.05rem,4vw,1.5rem);margin:2px 0 8px;text-align:center}
button{font-family:inherit;cursor:pointer;border:3px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;min-height:44px;font-size:1rem;font-weight:700}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.top{display:flex;justify-content:space-between;font-weight:700;margin:4px 2px}
.eq{display:flex;gap:clamp(6px,2vw,12px);justify-content:center;align-items:center;direction:ltr;margin:8px 0;min-height:64px}
.eb{min-width:clamp(48px,13vw,72px);height:clamp(48px,13vw,72px);padding:0 8px;border-radius:14px;background:var(--card);border:3px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,6vw,2.3rem);font-weight:900;font-family:inherit;color:var(--ink)}
.eb.ok{background:var(--good);color:#fff;border-color:var(--good)}
.op{font-size:clamp(1.5rem,6vw,2.3rem);font-weight:900}
input.blank{width:clamp(78px,22vw,120px);text-align:center;border-color:#ffb703;animation:glow 1.1s infinite;outline:none}
input.blank:focus{animation:none;box-shadow:0 0 0 5px #ffb70066,0 0 20px #ffb703}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 0 5px #ffb70044,0 0 18px #ffb703}}
@keyframes pc{50%{border-color:#ffd166;opacity:.6}}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
#scene{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:clamp(8px,2vw,16px);display:flex;flex-direction:column;gap:12px;align-items:center}
.trayc{position:relative;width:min(100%,460px);background:#6b3a1e;border-radius:18px;padding:10px}
.trayg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#4b2410;border-radius:12px;padding:10px;direction:ltr}
.cav{aspect-ratio:1;border-radius:50%;background:#2f1608;border:3px solid #8a5a35;display:flex;align-items:center;justify-content:center}
.cav.n{animation:pc 1s infinite;border-color:#ffb703}
.cav svg{width:88%}
.lidp{position:absolute;inset:0;border-radius:18px;background:#e0a526;border:6px solid #b9801a;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .8s;pointer-events:none;overflow:hidden}
.lidp.on{opacity:1}
.lidp:before{content:"";position:absolute;left:46%;right:46%;top:0;bottom:0;background:#d62828}
.lidp:after{content:"";position:absolute;top:42%;bottom:42%;left:0;right:0;background:#d62828}
.lidp b{position:relative;z-index:1;background:#fff;border-radius:50%;width:26%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(1.6rem,7vw,3rem);color:#6b3a1e}
.frame{display:flex;gap:calc(var(--W)*.3);justify-content:center;align-items:flex-end;direction:ltr;padding:10px;border:3px solid var(--bd);border-radius:16px;max-width:100%}
.frame.g{display:grid;grid-template-columns:repeat(5,var(--H));gap:8px}
.frame.full{border-color:var(--good);box-shadow:0 0 0 4px var(--good)}
.sl{border:2px dashed var(--bd);border-radius:5px;display:flex;flex-direction:column-reverse;gap:1px;padding:1px}
.sl.r{width:var(--W);height:calc(var(--W)*6.5)}
.sl.h{width:var(--H);height:var(--H);padding:0}
.sl i{flex:1;background:#2a9d8f;border-radius:2px}
.sl.f{border:2px solid #1f7a70}
.sl.n{animation:pc 1s infinite;border-color:#ffb703}
.sl.h.f{background-color:#2a9d8f;background-image:linear-gradient(#0004 1px,transparent 1px),linear-gradient(90deg,#0004 1px,transparent 1px);background-size:10% 10%}
.sl.sub{border:2px solid #1f7a70}
.sl.h.sub{flex-direction:row}
.sl .c{flex:1;border-radius:1px}
.sl .c.f{background:#f4a261}
.sl.h .c.f{background:#2a9d8f}
.sl .c.n{background:none;border:1px dashed #ffb703;animation:pc 1s infinite}
.sup,.belt{display:flex;gap:8px;justify-content:center;align-items:flex-end;direction:ltr;flex-wrap:wrap;min-height:48px;width:100%}
.belt{background:repeating-linear-gradient(90deg,var(--belt) 0 28px,rgba(0,0,0,.25) 28px 32px);animation:mv 1.2s linear infinite;border:4px solid #2b2e36;border-radius:16px;padding:8px;align-items:center}
@keyframes mv{to{background-position:32px 0}}
.sq{cursor:grab;touch-action:none;flex:0 0 auto}
.sq svg{width:100%;display:block;pointer-events:none}
.sq.c{width:clamp(46px,12vw,70px);filter:drop-shadow(0 3px 2px #0006)}
.sq.r{width:var(--W);height:calc(var(--W)*6.5);background:repeating-linear-gradient(#2a9d8f 0 calc(var(--W)*.65 - 1px),#1f7a70 calc(var(--W)*.65 - 1px) calc(var(--W)*.65));border:2px solid #1f7a70}
.sq.o{width:calc(var(--W)*1.2);height:calc(var(--W)*1.2);background:#f4a261;border:2px solid #d9822b;border-radius:4px}
.sq.h{width:var(--H);height:var(--H);background-color:#2a9d8f;border:2px solid #1f7a70;background-image:linear-gradient(#0004 1px,transparent 1px),linear-gradient(90deg,#0004 1px,transparent 1px);background-size:10% 10%}
.sq.t{width:calc(var(--H)*.22);height:var(--H);background:#2a9d8f;border:2px solid #1f7a70;border-radius:3px}
.ghost{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 6px 5px #0008)}
.rope{container-type:inline-size;position:relative;width:min(100%,400px);aspect-ratio:380/235}
.rope svg{position:absolute;inset:0;width:100%;height:100%}
.rc{position:absolute;width:20%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:4px solid #8b4a2b;background:#fff;color:#3a2a1e}
.rc.top{background:#e0a526;border-color:#b9801a;color:#6b3a1e}
.rc.ok{background:var(--good);border-color:#1f7a33;color:#fff}
.rc.blk{border:4px dashed #ffb703;background:#ffb70022;animation:glow 1.1s infinite}
.rc input{width:100%;border:0;background:transparent;text-align:center;font:inherit;color:#fff;outline:none;padding:0}
.say{display:flex;gap:10px;align-items:center;background:var(--say);border-radius:18px;padding:8px 12px;margin:10px 0;line-height:1.9;font-weight:700;font-size:clamp(.95rem,3.4vw,1.15rem)}
.say svg{width:clamp(48px,12vw,66px);height:auto;flex:0 0 auto}
#ctl{display:flex;gap:8px;justify-content:center}
.scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#1a0b3d,#0f0c29,#2b0a4a,#05102e);background-size:300% 300%;animation:bgm 10s ease infinite;color:#fff;overflow:auto;text-align:center}
@keyframes bgm{50%{background-position:100% 100%}}
.glass{background:rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);border-radius:26px;padding:clamp(16px,4vw,32px);box-shadow:0 0 44px rgba(122,92,255,.45),inset 0 0 22px rgba(255,255,255,.08);max-width:560px;width:100%;margin:auto}
.neon{color:#fff;text-shadow:0 0 6px #fff,0 0 16px #ff2fd6,0 0 34px #ff2fd6,0 0 58px #7a5cff;font-weight:900}
.big{font-size:clamp(1.5rem,7vw,2.6rem);margin:.3em 0}
.cnt{font-size:clamp(5rem,28vw,10rem);line-height:1.1;animation:zoom 1s ease-out;text-shadow:0 0 8px var(--g),0 0 26px var(--g),0 0 64px var(--g)}
.c3{--g:#00f0ff}.c2{--g:#ffe600}.c1{--g:#39ff14}
@keyframes zoom{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
.nm{width:min(100%,320px);padding:12px;font:inherit;font-size:1.1rem;text-align:center;border-radius:14px;border:2px solid #7ad7ff;background:rgba(255,255,255,.12);color:#fff;outline:none;box-shadow:0 0 14px #7ad7ff88}
.nm::placeholder{color:#ffffffaa}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:8px auto 14px}
.ic{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:6px;min-height:0;display:flex;justify-content:center}
.ic.sel{border-color:#39ff14;box-shadow:0 0 18px #39ff14;transform:scale(1.08)}
.go{background:linear-gradient(90deg,#ff2fd6,#7a5cff);color:#fff;border:0;font-size:1.2rem;padding:12px 28px;box-shadow:0 0 22px #ff2fd6;margin:6px}
.go.g2{background:rgba(255,255,255,.15);box-shadow:none;border:1px solid #fff6}
.cr{opacity:.85;font-size:.82rem;margin-top:16px;display:block;line-height:1.9}
.fi{display:inline-block;animation:bn 1s infinite}
@keyframes bn{50%{transform:translateY(-14px)}}
.sc{font-size:clamp(2.6rem,12vw,4.5rem);font-weight:900;color:#ffe600;text-shadow:0 0 12px #ffe600,0 0 34px #ff9500}
.st{margin:6px 0;opacity:.95;line-height:2}
#who{display:flex;align-items:center;gap:6px}
.mega{width:min(62vw,280px);aspect-ratio:1;background-color:#2a9d8f;background-image:linear-gradient(#0004 1px,transparent 1px),linear-gradient(90deg,#0004 1px,transparent 1px);background-size:10% 10%;border:4px solid #1f7a70;border-radius:10px;display:flex;align-items:center;justify-content:center;animation:merge 1s ease-out;box-shadow:0 0 34px #2a9d8f}
.mega b{font-size:clamp(2.2rem,12vw,4rem);color:#fff;text-shadow:0 2px 8px #000a}
.cube{width:min(62vw,270px);animation:merge 1s ease-out;filter:drop-shadow(0 0 18px #2a9d8f)}
.cube svg{width:100%;display:block}
@keyframes merge{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(3deg);opacity:1}100%{transform:scale(1)}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.fx span{position:absolute;font-size:clamp(1.8rem,7vw,3rem);animation:rise var(--d) ease-in forwards}
.fx span.fl{animation-name:fall}
@keyframes rise{from{transform:translateY(0) rotate(0)}to{transform:translateY(-115vh) rotate(25deg)}}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(115vh) rotate(360deg)}}
#mu{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;width:48px;height:48px;border-radius:50%;padding:0;font-size:1.4rem;background:rgba(30,20,60,.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.6);color:#fff;box-shadow:0 0 14px #7a5cffaa}
.logo{display:block;max-width:min(80%,260px);max-height:150px;object-fit:contain;margin:0 auto 10px;border-radius:18px}

</style>
</head>
<body>
<button id="mu" aria-label="قطع و وصل صدا">🔊</button>
<div id="scr" class="scr"></div>
<main id="game" style="display:none">
<h1 id="ttl"></h1>
<div class="top"><span id="prog"></span><span id="who"></span></div>
<div class="eq" id="eq"></div>
<div id="scene"></div>
<div class="say"><div id="bear"></div><div id="msg"></div></div>
<div id="ctl"></div>
</main>
<script>
const COL=[["#e63946","#ff9fb0"],["#2a9d8f","#8ee6da"],["#f4a261","#ffd9a8"],["#7b2cbf","#d3a8ff"],["#1d7bd8","#9fd0ff"]];
const candy=i=>{const[c,l]=COL[i%5];return `<svg viewBox='0 0 64 44'><path d='M3 8L19 22 3 36Z' fill='${c}'/><path d='M61 8L45 22 61 36Z' fill='${c}'/><ellipse cx='32' cy='22' rx='21' ry='18' fill='${c}'/><path d='M20 10Q24 22 20 34M44 10Q40 22 44 34' stroke='#fff' stroke-opacity='.35' stroke-width='3' fill='none'/><ellipse cx='26' cy='14' rx='9' ry='4.5' fill='${l}' opacity='.85'/></svg>`};
const BEAR=`<svg viewBox='0 0 80 80'><circle cx='18' cy='38' r='9' fill='#a8693c'/><circle cx='62' cy='38' r='9' fill='#a8693c'/><circle cx='40' cy='46' r='25' fill='#c8814b'/><ellipse cx='40' cy='55' rx='11' ry='8' fill='#f1cfa5'/><circle cx='31' cy='42' r='3.5' fill='#222'/><circle cx='49' cy='42' r='3.5' fill='#222'/><ellipse cx='40' cy='51' rx='4' ry='3' fill='#222'/><path d='M33 58Q40 64 47 58' stroke='#222' stroke-width='2.5' fill='none' stroke-linecap='round'/><rect x='27' y='14' width='26' height='14' fill='#fff'/><circle cx='29' cy='14' r='8' fill='#fff'/><circle cx='51' cy='14' r='8' fill='#fff'/><circle cx='40' cy='9' r='9' fill='#fff'/></svg>`;
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const LOGO='https://i.ibb.co/KjTk410x/In-Shot-20261012-140605176.jpg',MUSIC='https://dl.boxmusics.ir/songs/400/7/Ali%20Molaei%20-%20Shabe%20Toolani%20Bikalam.mp3';
let bgm=null,muted=false;
function playBgm(){try{if(!bgm){bgm=new Audio(MUSIC);bgm.loop=true;bgm.volume=.35}bgm.muted=muted;if(!muted)bgm.play().catch(()=>{})}catch(e){}}
function toggleMu(){muted=!muted;$('mu').textContent=muted?'🔇':'🔊';if(bgm){bgm.muted=muted;if(!muted&&bgm.paused)bgm.play().catch(()=>{})}else if(!muted)playBgm()}
$('mu').onclick=toggleMu;
let ac,S=1,list,idx,q,L,ok,first,hints,belt,msg,showF,bside,sd=null,t0=0,totMs=0,totH=0,totW=0,P={name:'',icon:'bear'};
const AN={bear:{c:'#c8814b',m:'#f1cfa5',e:'r',h:1},cat:{c:'#f4a261',m:'#fff3e6',e:'t',h:0},bunny:{c:'#f3f3f3',m:'#ffd6e0',e:'l',h:0},panda:{c:'#fff',m:'#fff',e:'b',h:1,p:1},frog:{c:'#6cc24a',m:'#d7f5c0',e:'f',h:1},fox:{c:'#e8702a',m:'#fff',e:'t',h:0}};
function icon(k,z){
  const a=AN[k];let e='';
  if(a.e=='r')e=`<circle cx='20' cy='34' r='10' fill='${a.c}'/><circle cx='60' cy='34' r='10' fill='${a.c}'/>`;
  else if(a.e=='b')e=`<circle cx='20' cy='34' r='10' fill='#222'/><circle cx='60' cy='34' r='10' fill='#222'/>`;
  else if(a.e=='t')e=`<path d='M14 46L18 14L38 32ZM66 46L62 14L42 32Z' fill='${a.c}'/>`;
  else if(a.e=='l')e=`<ellipse cx='29' cy='20' rx='8' ry='20' fill='${a.c}' stroke='#ddd'/><ellipse cx='51' cy='20' rx='8' ry='20' fill='${a.c}' stroke='#ddd'/>`;
  const ey=a.e=='f'?`<circle cx='27' cy='30' r='11' fill='${a.c}'/><circle cx='53' cy='30' r='11' fill='${a.c}'/><circle cx='27' cy='30' r='6' fill='#fff'/><circle cx='53' cy='30' r='6' fill='#fff'/><circle cx='27' cy='30' r='3' fill='#222'/><circle cx='53' cy='30' r='3' fill='#222'/>`:(a.p?`<ellipse cx='31' cy='47' rx='7' ry='8' fill='#222'/><ellipse cx='49' cy='47' rx='7' ry='8' fill='#222'/><circle cx='31' cy='47' r='3' fill='#fff'/><circle cx='49' cy='47' r='3' fill='#fff'/>`:`<circle cx='31' cy='47' r='3.5' fill='#222'/><circle cx='49' cy='47' r='3.5' fill='#222'/>`);
  const hat=a.h?`<rect x='27' y='14' width='26' height='12' fill='#fff' stroke='#ddd'/><circle cx='29' cy='14' r='8' fill='#fff' stroke='#ddd'/><circle cx='51' cy='14' r='8' fill='#fff' stroke='#ddd'/><circle cx='40' cy='9' r='9' fill='#fff' stroke='#ddd'/>`:'';
  return `<svg viewBox='0 0 80 80' width='${z}' height='${z}'>${e}<circle cx='40' cy='50' r='25' fill='${a.c}' stroke='#0002'/><ellipse cx='40' cy='58' rx='11' ry='8' fill='${a.m}'/>${ey}<ellipse cx='40' cy='54' rx='4' ry='3' fill='#222'/><path d='M33 62Q40 68 47 62' stroke='#222' stroke-width='2.5' fill='none' stroke-linecap='round'/>${hat}</svg>`;
}
const ov=h=>{$('game').style.display='none';const o=$('scr');o.style.display='flex';o.innerHTML=h;return o};
function welcome(){
  ov(`<div class='glass'><img class='logo' id='lg' src='${LOGO}' alt='لوگو'><div class='neon big'>🍫 شکلات‌ساز کوچولو 🍫</div><p>ماجرای ساختن ۱۰، ۱۰۰ و ۱۰۰۰</p><input id='nm' class='nm' placeholder='اسمت را بنویس' maxlength='20' autocomplete='off'><p>آیکون مورد علاقه‌ات را انتخاب کن:</p><div class='icons'>${Object.keys(AN).map(k=>`<button class='ic${k==P.icon?' sel':''}' data-k='${k}'>${icon(k,58)}</button>`).join('')}</div><button class='go' id='go'>شروع بازی ▶</button><small class='cr'>مدرسه‌ی فاطمه، مادر سید محمود</small></div>`);
  $('nm').value=P.name;$('lg').onerror=()=>$('lg').remove();
  document.querySelectorAll('.ic').forEach(b=>b.onclick=()=>{P.icon=b.dataset.k;document.querySelectorAll('.ic').forEach(x=>x.classList.toggle('sel',x==b))});
  $('go').onclick=()=>{P.name=$('nm').value.trim()||'دوست کوچولو';playBgm();startGame()};
}
function startGame(){totMs=0;totH=0;totW=0;intro(1)}
function intro(n){
  S=n;let c=3;const t='ساختن عدد '+fa(10**n);
  const draw=()=>{ov(`<div class='glass'><div class='neon'>مرحله‌ی ${fa(n)}</div><div class='neon big'>${t}</div><div class='cnt neon c${c}'>${fa(c)}</div></div>`);beep(380+c*120)};
  draw();const iv=setInterval(()=>{c--;if(c==0){clearInterval(iv);begin()}else draw()},1000);
}
function begin(){
  $('scr').style.display='none';$('game').style.display='';
  const v=shuf([1,2,3,4,5,6,7,8,9]),w=shuf([1,2,3,4,5,6,7,8,9]);
  list=S==1?[mkq(v[0],false,'A'),mkq(v[1],false,'A'),mkq(v[2],false,'B'),mkq(v[3],false,'B')]:[mkq(v[0],false,'A'),mkq(w[0],true,'A'),mkq(v[1],false,'B'),mkq(w[1],true,'B')];
  idx=0;$('ttl').textContent='ساختن عدد '+fa(10**S);start();
}
function final(){
  const sec=Math.round(totMs/1000),pen=Math.max(0,Math.min(20,Math.floor((sec-300)/10))),sc=Math.max(10,100-totH*4-totW*2-pen),st=sc>=85?3:sc>=65?2:1;
  const n=P.name,tip=totH>3?' برای امتیاز بیشتر، سعی کن کمتر از دکمه‌ی کمک استفاده کنی.':'';
  const fb=sc>=85?`آفرین ${n}! تو یک شکلات‌ساز حرفه‌ای هستی! تقریباً بدون کمک و خیلی سریع همه‌ی سفارش‌ها را تحویل دادی.`:sc>=65?`خیلی خوب بود ${n}! همه‌ی سفارش‌ها را درست تحویل دادی.${tip} دفعه‌ی بعد حتماً بهتر می‌شود!`:`${n}، دست مریزاد که تا آخر ادامه دادی! با تمرین بیشتر سریع‌تر و بهتر می‌شوی.${tip} دوباره بازی کن تا امتیازت بالاتر برود.`;
  ov(`<div class='glass'><div class='fi'>${icon(P.icon,110)}</div><div class='neon big' id='fn'></div><div class='sc'>${fa(sc)} <small style='font-size:.4em'>از ۱۰۰</small></div><div style='font-size:2rem'>${'⭐'.repeat(st)}</div><div class='st'>زمان: ${fa(Math.floor(sec/60))} دقیقه و ${fa(sec%60)} ثانیه<br>تعداد کمک: ${fa(totH)} &nbsp;|&nbsp; تعداد اشتباه: ${fa(totW)}</div><p id='fb' style='line-height:2'></p><button class='go' id='again'>دوباره بازی کن ▶</button><button class='go g2' id='chg'>تغییر اسم و آیکون</button><small class='cr'>مدرسه‌ی فاطمه، مادر سید محمود</small></div>`);
  $('fn').textContent=n;$('fb').textContent=fb;
  $('again').onclick=startGame;$('chg').onclick=welcome;beep(880);
}
function beep(f){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.value=.12;o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.stop(ac.currentTime+.26)}catch(e){}}
function mkq(x,part,mode){
  if(S==1)return{a:x,b:10-x,t:10,n:10-x,base:x,unit:1,vis:'tray',part:false,mode};
  const U=S==2?10:100,sub=U/10,vis=S==2?'rods':'flats';
  return part?{a:9*U+x*sub,b:(10-x)*sub,t:10*U,n:10-x,base:x,unit:sub,vis,part:true,mode}:{a:x*U,b:(10-x)*U,t:10*U,n:10-x,base:x,unit:U,vis,part:false,mode};
}
function start(){
  q=list[idx];L=0;ok=false;first=true;hints=0;showF=false;bside=rnd(0,1);t0=Date.now();clearTimeout(advT);
  belt=[];for(let i=0;i<q.n+(S==1?2:0);i++)belt.push(q.base+i);
  const W=q.vis=='tray'?'شکلات‌ها':q.vis=='rods'?(q.part?'یکی‌ها':'ده تایی‌ها'):(q.part?'ده تایی‌ها':'صد تایی‌ها');
  msg=q.mode=='B'?'عدد جای خالی را وارد کن.':`${fa(q.a)} داریم. ${W} را بکش تا ${fa(q.t)} شود و عدد جای خالی را وارد کن.`;
  render();
}
const isDone=()=>ok&&(q.mode=='B'||L>=q.n);
function frameH(done){
  if(done&&q.vis!='tray'&&q.t>=100)return mergeH();
  if(q.vis=='tray'){let c='';for(let i=0;i<10;i++){const f=i<q.base+L;c+=`<div class='cav ${f?'':'n'}'>${f?candy(i):''}</div>`}
    return `<div class='trayc' id='colT'><div class='trayg'>${c}</div><div class='lidp${done?' on':''}'><b>${fa(10)}</b></div></div>`}
  const cls=q.vis=='rods'?'r':'h';let s='';
  for(let i=0;i<10;i++){
    if(q.part&&i==9){let c='';for(let j=0;j<10;j++)c+=`<i class='c ${j<q.base+L?'f':'n'}'></i>`;s+=`<div class='sl ${cls} sub'>${c}</div>`}
    else{const f=q.part?true:i<q.base+L;s+=`<div class='sl ${cls} ${f?'f':'n'}'>${f&&cls=='r'?'<i></i>'.repeat(10):''}</div>`}
  }
  return `<div class='frame${cls=='h'?' g':''}${done?' full':''}' id='colT'>${s}</div>`;
}
function ropeH(){
  const gx=bside?290:90,ex=bside?90:290,lf=x=>((x-38)/380*100).toFixed(2)+'%',tp='64.7%';
  const rope=x=>`<path d='M190 76Q${(190+x)/2} 100 ${x} 150' stroke='#a9742f' stroke-width='8' fill='none' stroke-dasharray='9 3' stroke-linecap='round'/>`;
  const fs=n=>`font-size:${String(n).length>=4?6.5:String(n).length==3?7.5:9}cqw`;
  return `<div class='rope'><svg viewBox='0 0 380 235'>${rope(gx)}${rope(ex)}</svg><div class='rc top' style='left:${lf(190)};top:0;${fs(q.t)}'>${fa(q.t)}</div><div class='rc' style='left:${lf(gx)};top:${tp};${fs(q.a)}'>${fa(q.a)}</div>`+
    (ok?`<div class='rc ok' style='left:${lf(ex)};top:${tp};${fs(q.b)}'>${fa(q.b)}</div>`:`<div class='rc blk' style='left:${lf(ex)};top:${tp};${fs(q.b)}'><input id='inp' inputmode='numeric' maxlength='${String(q.b).length}' autocomplete='off' aria-label='جای خالی'></div>`)+`</div>`;
}
function render(){
  const done=isDone(),A=q.mode=='A';
  $('prog').textContent=`سؤال ${fa((S-1)*4+idx+1)} از ۱۲`;$('who').innerHTML=icon(P.icon,30)+'<span></span>';$('who').lastChild.textContent=P.name;
  $('eq').style.display=A||done?'':'none';
  $('eq').innerHTML=`<div class='eb'>${fa(q.a)}</div><div class='op'>+</div>`+(ok?`<div class='eb ok'>${fa(q.b)}</div>`:(A?`<input id='inp' class='eb blank' inputmode='numeric' maxlength='${String(q.b).length}' autocomplete='off' aria-label='جای خالی'>`:''))+`<div class='op'>=</div><div class='eb'>${fa(q.t)}</div>`;
  const sc=q.vis=='tray'?'c':q.vis=='rods'?(q.part?'o':'r'):(q.part?'t':'h');
  const sup=belt.map((c,i)=>`<div class='sq ${sc}' data-i='${i}'>${sc=='c'?candy(c):''}</div>`).join('');
  $('scene').innerHTML=A?frameH(done)+`<div class='${sc=='c'?'belt':'sup'}'>${sup}</div>`:ropeH()+(showF?frameH(done):'');
  $('bear').innerHTML=icon(P.icon,66);$('msg').textContent=msg;
  const c=$('ctl');c.innerHTML='';const e=document.createElement('button');
  if(done){e.className='p';e.textContent=idx<3?'بعدی ◀':(S<3?'مرحله‌ی بعد ◀':'نمایش نتیجه ◀');e.onclick=nextQ}
  else{e.textContent='💡 کمک';e.onclick=help}
  c.appendChild(e);
  const inp=$('inp');
  if(inp){inp.oninput=onType;inp.onkeydown=ev=>{if(ev.key=='Enter')check(inp.value.replace(/\D/g,''))};if(matchMedia('(pointer:fine)').matches)inp.focus()}
}
function onType(e){
  const v=e.target.value.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');
  e.target.value=fa(v);
  if(v.length>=String(q.b).length)check(v);
}
function check(v){
  if(ok||!v)return;
  if(+v==q.b){ok=true;beep(660);msg=q.mode=='A'&&L<q.n?'درست است! حالا شکل‌ها را بگذار.':'';fin()}
  else{first=false;totW++;beep(200);msg=q.mode=='A'&&L>=q.n?'نه. شکل‌ها را بشمار و دوباره عدد را وارد کن.':'نه. دوباره امتحان کن.';render()}
}
function fin(){
  if(isDone()){totMs+=Date.now()-t0;const m=q.mode=='A'&&S>1?(S==2?' ده تا ده تایی می‌شود یک صد تایی!':' ده تا صد تایی می‌شود یک هزار تایی!'):'';
    msg=`آفرین! ${fa(q.a)} + ${fa(q.b)} = ${fa(q.t)}.${m}`;party();jingle();advT=setTimeout(nextQ,(q.mode=='A'&&q.vis!='tray')?4500:3200)}
  render();
}
function place(i){
  if(q.mode!='A'||L>=q.n||!belt[i]&&belt[i]!==0)return;
  belt.splice(i,1);L++;beep(300+L*40);
  msg=L>=q.n?(ok?'':'حالا عدد جای خالی را وارد کن.'):`الان ${fa(q.a+L*q.unit)} است.`;
  fin();
}
function help(){
  hints++;totH++;
  if(q.mode=='A'){if(L<q.n)place(0);else{msg='شکل‌های اضافه شده را بشمار.';render()}}
  else{showF=true;msg='جاهای خالی را بشمار.';render()}
}
const SC=$('scene');
function sm(e){sd.g.style.left=e.clientX+'px';sd.g.style.top=e.clientY+'px';if(Math.hypot(e.clientX-sd.x,e.clientY-sd.y)>8)sd.m=true}
SC.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.sq');if(!el||q.mode!='A'||L>=q.n)return;e.preventDefault();
  const g=document.createElement('div');g.className='ghost '+el.className;g.innerHTML=el.innerHTML;document.body.appendChild(g);
  sd={el,g,i:+el.dataset.i,x:e.clientX,y:e.clientY,m:false};el.style.opacity=.3;sm(e);el.setPointerCapture(e.pointerId);
});
SC.addEventListener('pointermove',e=>{if(sd)sm(e)});
SC.addEventListener('pointerup',e=>{
  if(!sd)return;const d=sd;sd=null;d.g.remove();d.el.style.opacity=1;
  const t=$('colT');if(!t)return;const r=t.getBoundingClientRect(),p=50;
  const over=e.clientX>=r.left-p&&e.clientX<=r.right+p&&e.clientY>=r.top-p&&e.clientY<=r.bottom+p;
  if(!d.m||over)place(d.i);
});
SC.addEventListener('pointercancel',()=>{if(sd){sd.g.remove();sd.el.style.opacity=1;sd=null}});
let advT=0;
function nextQ(){clearTimeout(advT);if(idx<3){idx++;start()}else if(S<3)intro(S+1);else final()}
function mergeH(){
  if(q.t==100)return `<div class='mega'><b>${fa(100)}</b></div>`;
  const P=(a,b)=>[20+110*a+40*b,60-35*b],Q=(b,c)=>[130+40*b,60-35*b+110*c],ln=(a,b)=>`<line x1='${a[0]}' y1='${a[1]}' x2='${b[0]}' y2='${b[1]}'/>`;
  let g='';
  for(let i=1;i<10;i++){const k=i/10;g+=ln(P(k,0),P(k,1))+ln(P(0,k),P(1,k))+ln(Q(k,0),Q(k,1))+ln(Q(0,k),Q(1,k))+ln([20+11*i,60],[20+11*i,170])+ln([20,60+11*i],[130,60+11*i])}
  return `<div class='cube'><svg viewBox='0 0 200 190'><g stroke='#0005' stroke-width='.8'><polygon points='20,60 130,60 130,170 20,170' fill='#2a9d8f'/><polygon points='20,60 60,25 170,25 130,60' fill='#4cc9b9'/><polygon points='130,60 170,25 170,135 130,170' fill='#1f7a70'/>${g}</g><text x='75' y='128' text-anchor='middle' font-size='34' font-weight='900' fill='#fff' stroke='#0006' stroke-width='1'>${fa(1000)}</text></svg></div>`;
}
function party(){
  const f=document.createElement('div');f.className='fx';
  const B=['🎈','🎈','🎈','🎉','⭐'],F=['🌸','🌼','🌷','🌺','⭐'];
  for(let i=0;i<24;i++){const s=document.createElement('span'),b=i%2==0;s.textContent=(b?B:F)[rnd(0,4)];s.style.left=rnd(2,92)+'%';s.style.setProperty('--d',rnd(18,32)/10+'s');s.style.animationDelay=rnd(0,8)/10+'s';if(b)s.style.bottom='-60px';else{s.style.top='-60px';s.className='fl'}f.appendChild(s)}
  document.body.appendChild(f);setTimeout(()=>f.remove(),4200);
}
function jingle(){[523,659,784,1047,1319].forEach((n,i)=>setTimeout(()=>beep(n),i*120))}
welcome();
</script>
